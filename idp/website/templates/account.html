<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Create account' if mode == 'register' else 'Sign in' }} · Mini SSO</title><style>body{font:16px system-ui;background:#f5f4f0;color:#20221e;max-width:420px;margin:10vh auto;padding:24px}form{background:#fff;padding:24px;border:1px solid #ddd;border-radius:12px}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}button{margin-top:20px;padding:12px 18px;border:0;border-radius:7px;background:#526648;color:#fff;cursor:pointer}.error{color:#9a3b31}a{color:#526648}</style></head><body><p><a href="/">← Mini SSO</a></p><h1>{{ 'Create an account' if mode == 'register' else 'Sign in' }}</h1>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}"><label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="80" autocomplete="username"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="12" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"><button type="submit">{{ 'Create account' if mode == 'register' else 'Continue' }}</button></form><p>{% if mode == 'register' %}Already registered? <a href="{{ url_for('main.login', next=next) }}">Sign in</a>{% else %}New here? <a href="{{ url_for('main.register', next=next) }}">Create an account</a>{% endif %}</p></body></html>
