<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Authorize · Mini SSO</title><style>body{font:16px system-ui;background:#f5f4f0;color:#20221e;max-width:520px;margin:10vh auto;padding:24px}.card{background:#fff;padding:24px;border:1px solid #ddd;border-radius:12px}button{padding:12px 18px;border:0;border-radius:7px;cursor:pointer}.allow{background:#526648;color:white}.deny{background:#eee;margin-left:8px}</style></head><body><div class="card"><p>MINI SSO · PERMISSION REQUEST</p><h1>{{ grant.client.client_name }} wants to sign you in</h1><p>Signed in as <strong>{{ user.username }}</strong></p><p>This app is requesting: <strong>{{ grant.request.scope }}</strong></p><p>Your password stays with Mini SSO.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="allow" name="confirm" value="yes">Allow and continue</button><button class="deny" name="confirm" value="no">Deny</button></form></div></body></html>
