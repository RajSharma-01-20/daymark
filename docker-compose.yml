services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minisso
      POSTGRES_USER: minisso
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - minisso_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisso -d minisso"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  minisso_data:
